name: Release

on:
  push:
    tags:
      - 'v*-orcust'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: darwin-arm64
          - goos: windows
            goarch: amd64
            asset: windows-x64.exe
          - goos: windows
            goarch: arm64
            asset: windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release asset
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          go build -trimpath -ldflags '-w -s' -o "BaiduPCS-Go-${version}-${{ matrix.asset }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: BaiduPCS-Go-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum BaiduPCS-Go-* > BaiduPCS-Go-${GITHUB_REF_NAME#v}-checksums.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/BaiduPCS-Go-*
          generate_release_notes: true
